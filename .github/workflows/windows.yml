name: Windows desktop

on:
  pull_request:
    paths:
      - apps/desktop/**
      - rust-toolchain.toml
      - .github/workflows/windows.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-desktop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  x64:
    runs-on: windows-2022
    timeout-minutes: 60
    env:
      CARGO_TARGET_DIR: C:\b
      LIBCLANG_PATH: C:\Program Files\LLVM\bin
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Configure Visual Studio x64 shell and Ninja
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw 'Visual Studio 2022 C++ tools not found.' }
          $vcvars = Join-Path $vsPath 'VC\Auxiliary\Build\vcvars64.bat'
          $beforePath = [System.Collections.Generic.HashSet[string]]::new([System.StringComparer]::OrdinalIgnoreCase)
          foreach ($entry in ($env:PATH -split ';')) {
            if ($entry) { [void]$beforePath.Add($entry.TrimEnd('\')) }
          }
          cmd /c "`"$vcvars`" && set" | ForEach-Object {
            if ($_ -match '^([^=]+)=(.*)$') {
              $k = $matches[1]
              $v = $matches[2]
              if ($k -ieq 'PATH') {
                $added = @($v -split ';' | Where-Object { $_ -and -not $beforePath.Contains($_.TrimEnd('\')) })
                [array]::Reverse($added)
                $added | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
              } elseif ($k -in @('INCLUDE', 'LIB', 'LIBPATH', 'VCToolsInstallDir', 'WindowsSdkDir', 'WindowsSDKVersion', 'UniversalCRTSdkDir')) {
                "$k=$v" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
              }
            }
          }
          $ninjaDir = Join-Path $vsPath 'Common7\IDE\CommonExtensions\Microsoft\CMake\Ninja'
          if (Test-Path (Join-Path $ninjaDir 'ninja.exe')) {
            $ninjaDir | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
            & (Join-Path $ninjaDir 'ninja.exe') --version
          } else {
            & ninja --version
          }
          if ($LASTEXITCODE -ne 0) { throw 'Ninja build tool not found.' }
          "CMAKE_GENERATOR=Ninja" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Rust toolchain
        run: |
          rustup show
          rustc --version

      - name: Vulkan SDK
        shell: pwsh
        run: |
          $version = '1.4.363.0'
          $name = "vulkansdk-windows-X64-$version.exe"
          $installer = Join-Path $env:RUNNER_TEMP $name
          $sdk = Join-Path $env:RUNNER_TEMP "vulkan-$version"
          curl.exe -fLsS --retry 3 "https://sdk.lunarg.com/sdk/download/$version/windows/$name" -o $installer
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan SDK download failed.' }
          if ((Get-FileHash -Algorithm SHA256 $installer).Hash -ne '94a82d378f7a5e3e54c9db7d2fb7016af136e14ac0a18dbf0f2f67a36352d141') {
            throw 'Vulkan SDK checksum mismatch.'
          }
          $install = Start-Process -FilePath $installer -ArgumentList @('--root', ('"{0}"' -f $sdk), '--accept-licenses', '--default-answer', '--confirm-command', 'install') -Wait -PassThru
          if ($install.ExitCode -ne 0) { throw "Vulkan SDK installer exited $($install.ExitCode)." }
          $glslc = Join-Path $sdk 'Bin\glslc.exe'
          & $glslc --version
          if ($LASTEXITCODE -ne 0) { throw 'Vulkan shader compiler failed.' }
          "VULKAN_SDK=$sdk" >> $env:GITHUB_ENV

      - name: Build and test frontend
        run: |
          npm ci
          npm run build
          npm test

      - name: Rust format and tests
        working-directory: apps/desktop/src-tauri
        run: |
          cargo fmt --check
          cargo test --locked --target x86_64-pc-windows-msvc --lib -- --test-threads=1

      - name: Package portable x64 build
        run: ./scripts/build-portable-windows.ps1

      - uses: actions/upload-artifact@v7
        with:
          name: munia-windows-x64
          path: C:\b\portable\Munia-*-windows-x64.zip
          if-no-files-found: error
